name: ci

on:
    workflow_dispatch:
    pull_request:
    push:
        tags:
            - "dev*"

permissions:
    contents: read

jobs:
    verify-target:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-24.04
                      target: linux-x64
                      rust_target: x86_64-unknown-linux-musl
                      zig_arch: x86_64
                    - runner: ubuntu-24.04-arm
                      target: linux-arm64
                      rust_target: aarch64-unknown-linux-musl
                      zig_arch: aarch64
                    - runner: macos-15-intel
                      target: darwin-x64
                      rust_target: x86_64-apple-darwin
                    - runner: macos-15
                      target: darwin-arm64
                      rust_target: aarch64-apple-darwin
                    - runner: windows-2022
                      target: windows-x64
                      rust_target: x86_64-pc-windows-msvc
                    - runner: windows-11-arm
                      target: windows-arm64
                      rust_target: aarch64-pc-windows-msvc

        name: ${{ matrix.target }}
        runs-on: ${{ matrix.runner }}
        defaults:
            run:
                shell: bash

        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v5
              with:
                  version: 10.13.1
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
            - name: 安装 Unix 测试依赖
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  if [[ "$RUNNER_OS" == "Linux" ]]; then
                      sudo apt-get update
                      sudo apt-get install -y tmux fish
                  else
                      brew install tmux fish
                  fi
            - name: 安装 Rust 工具链
              run: |
                  rustup toolchain install stable --profile minimal
                  rustup default stable
                  rustup target add "${{ matrix.rust_target }}"
            - name: 安装 Zig 工具链
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  set -euo pipefail
                  zig_root="$RUNNER_TEMP/zig-0.14.1"
                  curl -fsSL "https://ziglang.org/download/0.14.1/zig-${{ matrix.zig_arch }}-linux-0.14.1.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
                  mkdir -p "$zig_root"
                  tar -xJf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$zig_root"
                  echo "$zig_root" >> "$GITHUB_PATH"
            - name: 安装 cargo-zigbuild
              if: runner.os == 'Linux'
              run: cargo install --locked cargo-zigbuild --version 0.23.0
            - run: node ./scripts/version-state.mjs check-development
            - run: pnpm install --frozen-lockfile
            # PowerShell 的交互、转义和版本差异晦涩难懂，难以写出稳定且有证明力的 PTY 测试。
            # Windows 验收固定使用 Git Bash；这只影响测试 shell，不改变产品默认 Windows shell。
            - name: 配置 Windows Git Bash 测试运行时
              if: runner.os == 'Windows'
              run: |
                  set -euo pipefail
                  git_bash='/c/Program Files/Git/bin/bash.exe'
                  if [[ ! -x "$git_bash" ]]; then
                      git_bash=$(command -v bash)
                  fi
                  printf 'PORTABLE_DEVSHELL_WINDOWS_TEST_SHELL=%s\n' "$(cygpath -w "$git_bash")" >> "$GITHUB_ENV"
            - name: 安装 Web 验收 Chromium
              if: matrix.target == 'linux-x64'
              shell: bash
              run: |
                  pnpm --filter @portable-devshell/control exec playwright install --with-deps chromium
                  chromium_path=$(pnpm --filter @portable-devshell/control exec node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")
                  echo "PORTABLE_DEVSHELL_CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
                  echo "PORTABLE_DEVSHELL_REQUIRE_CHROMIUM=1" >> "$GITHUB_ENV"
            - name: 运行完整开发验收套件
              run: node ./scripts/run-development-ci.mjs "${{ matrix.target }}"
            - name: 上传最终验收日志
              if: always() && matrix.target == 'linux-x64'
              uses: actions/upload-artifact@v7
              with:
                  name: linux-acceptance-${{ github.sha }}
                  path: acceptance.log
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: release-assets-${{ matrix.target }}-${{ github.sha }}
                  path: ci-artifacts/*
                  if-no-files-found: ignore
