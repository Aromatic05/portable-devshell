name: ci

on:
    workflow_dispatch:
    pull_request:
    push:
        tags:
            - "dev*"

permissions:
    contents: read

jobs:
    common:
        name: common-linux-x64
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v5
              with:
                  version: 10.13.1
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
            - name: 安装 Unix 测试依赖
              run: |
                  sudo apt-get update
                  sudo apt-get install -y tmux fish
            - name: 安装 Rust 工具链
              run: |
                  rustup toolchain install stable --profile minimal
                  rustup default stable
            - run: node ./scripts/version-state.mjs check-development
            - run: pnpm install --frozen-lockfile
            - name: 安装 Web 验收 Chromium
              shell: bash
              run: |
                  pnpm --filter @portable-devshell/control exec playwright install --with-deps chromium
                  chromium_path=$(pnpm --filter @portable-devshell/control exec node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")
                  echo "PORTABLE_DEVSHELL_CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
                  echo "PORTABLE_DEVSHELL_REQUIRE_CHROMIUM=1" >> "$GITHUB_ENV"
            - name: 运行通用正确性门禁
              run: node ./scripts/run-development-ci.mjs --common

    macos-contract:
        name: macos-contract-arm64
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v5
              with:
                  version: 10.13.1
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
            - name: 安装 Unix 测试依赖
              run: brew install tmux fish
            - name: 安装 Rust 工具链
              run: |
                  rustup toolchain install stable --profile minimal
                  rustup default stable
            - run: node ./scripts/version-state.mjs check-development
            - run: pnpm install --frozen-lockfile
            - name: 运行 macOS 平台行为门禁
              run: node ./scripts/run-development-ci.mjs --platform-contract

    verify-target:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-24.04
                      target: linux-x64
                      rust_target: x86_64-unknown-linux-musl
                      zig_arch: x86_64
                    - runner: ubuntu-24.04-arm
                      target: linux-arm64
                      rust_target: aarch64-unknown-linux-musl
                      zig_arch: aarch64
                    - runner: macos-15-intel
                      target: darwin-x64
                      rust_target: x86_64-apple-darwin
                    - runner: macos-15
                      target: darwin-arm64
                      rust_target: aarch64-apple-darwin
                    - runner: windows-2022
                      target: windows-x64
                      rust_target: x86_64-pc-windows-msvc
                    - runner: windows-11-arm
                      target: windows-arm64
                      rust_target: aarch64-pc-windows-msvc

        name: ${{ matrix.target }}
        runs-on: ${{ matrix.runner }}

        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v5
              with:
                  version: 10.13.1
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
            - name: 安装 Rust 工具链
              run: |
                  rustup toolchain install stable --profile minimal
                  rustup default stable
                  rustup target add "${{ matrix.rust_target }}"
            - name: 安装 Zig 工具链
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  set -euo pipefail
                  zig_root="$RUNNER_TEMP/zig-0.14.1"
                  curl -fsSL "https://ziglang.org/download/0.14.1/zig-${{ matrix.zig_arch }}-linux-0.14.1.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
                  mkdir -p "$zig_root"
                  tar -xJf "$RUNNER_TEMP/zig.tar.xz" --strip-components=1 -C "$zig_root"
                  echo "$zig_root" >> "$GITHUB_PATH"
            - name: 安装 cargo-zigbuild
              if: runner.os == 'Linux'
              run: cargo install --locked cargo-zigbuild --version 0.23.0
            - run: node ./scripts/version-state.mjs check-development
            - run: pnpm install --frozen-lockfile
            - name: 安装 Web 验收 Chromium
              if: matrix.target == 'linux-x64'
              shell: bash
              run: |
                  pnpm --filter @portable-devshell/control exec playwright install --with-deps chromium
                  chromium_path=$(pnpm --filter @portable-devshell/control exec node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")
                  echo "PORTABLE_DEVSHELL_CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
                  echo "PORTABLE_DEVSHELL_REQUIRE_CHROMIUM=1" >> "$GITHUB_ENV"
            # Windows PowerShell/ConPTY 的交互、转义和终端语义过于晦涩且不稳定，
            # 当前无法写出足够稳定且有证明力的 runtime 测试。Windows target plan
            # 只构建 JS 应用、原生 Worker 和最终应用包；通用 lint/typecheck/test 已由
            # common job 证明，避免在两个 Windows 架构上重复执行平台无关门禁。
            - name: 运行目标发布资产门禁
              run: node ./scripts/run-development-ci.mjs --target "${{ matrix.target }}"
            - name: 上传最终集成日志
              if: always() && matrix.target == 'linux-x64'
              uses: actions/upload-artifact@v7
              with:
                  name: linux-acceptance-${{ github.sha }}
                  path: acceptance.log
                  if-no-files-found: ignore
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: release-assets-${{ matrix.target }}-${{ github.sha }}
                  path: ci-artifacts/*
                  if-no-files-found: ignore
