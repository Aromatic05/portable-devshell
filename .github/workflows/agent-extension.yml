name: agent-extension

on:
    push:
        tags:
            - "agent-v*"

concurrency:
    group: agent-extension-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v5
              with:
                  version: 10.13.1
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
                  registry-url: https://registry.npmjs.org
            - name: Verify Agent Extension tag
              shell: bash
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  set -euo pipefail
                  version=$(node -p "require('./extensions/agent/package.json').version")
                  if [ "$GITHUB_REF_NAME" != "agent-v$version" ]; then
                    echo "Agent Extension tag $GITHUB_REF_NAME does not match package version $version" >&2
                    exit 1
                  fi
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
                    echo "Agent Extension release commit is not an ancestor of the default branch" >&2
                    exit 1
                  fi
            - run: pnpm install --frozen-lockfile
            - name: Validate Agent Extension
              run: |
                  pnpm --filter @portable-devshell/agent-extension test
                  pnpm --filter @portable-devshell/agent-extension build
                  npm pack --dry-run ./extensions/agent
            - name: Publish Agent Extension
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npm publish ./extensions/agent --access public --provenance
