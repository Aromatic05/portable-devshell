name: beta-matrix-extended

# Opt-in integration tests: use an isolated Testspace root and native platform workers.
# These suites do not run on every pull request.
on:
    workflow_dispatch:
        inputs:
            suite:
                description: "Extended beta verification suite"
                required: true
                type: choice
                options:
                    - upgrade
                    - extension
                    - workflow
                    - recovery
                    - retirement
                    - browser
                    - handoff
                    - chains
                    - windows-psmux

permissions:
    contents: read

jobs:
    linux-testspace:
        if: inputs.suite != 'windows-psmux'
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v5
            - name: Set isolated Testspace root
              shell: bash
              run: echo "DEVSHELL_TESTSPACE_ROOT=$RUNNER_TEMP/beta-matrix-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
            - uses: pnpm/action-setup@v5
              with:
                  version: 10.13.1
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
            - name: Install test dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y tmux fish zsh
                  rustup toolchain install stable --profile minimal
                  rustup default stable
                  pnpm install --frozen-lockfile
            - name: Real release upgrade, migration and rollback
              if: inputs.suite == 'upgrade'
              run: pnpm testspace upgrade-smoke
            - name: Build isolated Testspace runtime
              if: inputs.suite == 'extension' || inputs.suite == 'workflow' || inputs.suite == 'recovery' || inputs.suite == 'retirement' || inputs.suite == 'browser' || inputs.suite == 'handoff' || inputs.suite == 'chains'
              run: |
                  pnpm build
                  pnpm test:prepare
            - name: Start isolated Control and Workers
              if: inputs.suite == 'extension' || inputs.suite == 'workflow' || inputs.suite == 'recovery' || inputs.suite == 'retirement'
              run: pnpm testspace start --skip-build
            - name: Extension candidate failure and generation restoration
              if: inputs.suite == 'extension'
              run: pnpm testspace extension-smoke
            - name: Workflow, Approval and Mailing integration
              if: inputs.suite == 'workflow'
              run: |
                  pnpm testspace workflow-smoke
                  pnpm testspace approval-smoke
                  pnpm testspace mailing-smoke
            - name: Restart, audit persistence and stream gap recovery
              if: inputs.suite == 'recovery'
              shell: bash
              run: pnpm testspace recovery-smoke 2>&1 | tee "$RUNNER_TEMP/beta-matrix-recovery.log"
            - name: Verify worker retirement after Control restart
              if: inputs.suite == 'retirement'
              shell: bash
              run: pnpm testspace retirement-smoke 2>&1 | tee "$RUNNER_TEMP/beta-matrix-retirement.log"
            - name: Real Chromium browser Audit replay and Instance stop-start
              if: inputs.suite == 'browser'
              shell: bash
              run: pnpm acceptance:web 2>&1 | tee "$RUNNER_TEMP/beta-matrix-browser.log"
            - name: Real 190-second tmux handoff and recovery
              if: inputs.suite == 'handoff'
              shell: bash
              run: pnpm acceptance:tmux-handoff 2>&1 | tee "$RUNNER_TEMP/beta-matrix-handoff.log"
            - name: Install Chromium for multi-client chain
              if: inputs.suite == 'chains'
              shell: bash
              run: |
                  pnpm --filter @portable-devshell/control exec playwright install --with-deps chromium
                  chromium_path=$(pnpm --filter @portable-devshell/control exec node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")
                  echo "PORTABLE_DEVSHELL_CHROMIUM=$chromium_path" >> "$GITHUB_ENV"
                  echo "PORTABLE_DEVSHELL_REQUIRE_CHROMIUM=1" >> "$GITHUB_ENV"
            - name: Four complete functional chain acceptance tests
              if: inputs.suite == 'chains'
              shell: bash
              run: |
                  set -o pipefail
                  node acceptance/run-chain-matrix.mjs --all 2>&1 | tee "$RUNNER_TEMP/beta-matrix-chains.log"
            - name: Stop isolated Testspace
              if: always() && (inputs.suite == 'extension' || inputs.suite == 'workflow' || inputs.suite == 'recovery' || inputs.suite == 'retirement')
              run: pnpm testspace stop
            - name: Upload isolated Testspace logs
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: beta-matrix-linux-${{ inputs.suite }}-${{ github.run_id }}
                  path: |
                      ${{ env.DEVSHELL_TESTSPACE_ROOT }}/*.log
                      ${{ runner.temp }}/beta-matrix-recovery.log
                      ${{ runner.temp }}/beta-matrix-retirement.log
                      ${{ runner.temp }}/beta-matrix-browser.log
                      ${{ runner.temp }}/beta-matrix-handoff.log
                      ${{ runner.temp }}/beta-matrix-chains.log
                  if-no-files-found: ignore

    windows-psmux:
        if: inputs.suite == 'windows-psmux'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: windows-2022
                      name: x64
                    - runner: windows-11-arm
                      name: arm64
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@v5
            - name: Install Rust toolchain
              shell: pwsh
              run: |
                  rustup toolchain install stable --profile minimal
                  rustup default stable
            - name: Verify native PowerShell backend
              shell: pwsh
              run: |
                  Get-Command pwsh | Out-Null
                  cargo test --locked -p devshell-worker --test tmux_windows_contract -- --nocapture
