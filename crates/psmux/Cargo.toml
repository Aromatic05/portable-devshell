[package]
name = "psmux"
version = "3.3.8"
edition = "2021"
autobins = false
description = "Embedded psmux runtime for devshell-worker on Windows"
license = "MIT"
repository = "https://github.com/psmux/psmux"
build = "build.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_Storage_FileSystem",
] }

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
portable-pty = { version = "0.9.7", path = "crates/portable-pty-psmux", package = "portable-pty-psmux" }
which = "8.0.6"
chrono = "0.4.45"
vt100 = { version = "0.16.13", path = "crates/vt100-psmux", package = "vt100-psmux" }
unicode-width = "0.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
regex = "1.13.0"
glob = "0.3.4"
anyhow = "1.0.104"
base64 = "0.23.1"

[workspace]
members = [
    ".",
    "crates/portable-pty-psmux",
    "crates/vt100-psmux",
]
resolver = "2"
