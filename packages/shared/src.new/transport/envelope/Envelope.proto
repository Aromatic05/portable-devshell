syntax = "proto3";

package devshell.transport;

message Address {
  string host = 1;
  string port = 2;
}

message Envelope {
  Address source = 1;
  Address dest = 2;
  Packet packet = 3;
}

message Packet {
  oneof value {
    bytes json = 1;
    StreamData stream_data = 2;
  }
}

message StreamData {
  string id = 1;
  uint64 seq = 2;
  bytes data = 3;
}
